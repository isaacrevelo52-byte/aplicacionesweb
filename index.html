<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura Lico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="funciones.js" defer></script>
</head>
<body>
    <div class="container-xs bg-warning p-3">
        <h2>Factura Lico</h2>
        
        <section>
            <div class="bg-secondary p-2 mb-2">
                <label>Cliente</label>
                <input type="text" id="nombreCliente"/>
                <label>Cedula</label>
                <input type="text" id="cedulaCliente"/>
                <label>Sexo</label>
                <input type="text" id="sexoCliente"/>
            </div>
        </section>

        <section>
            <div class="bg-primary p-2 mb-2">
                <h4>Agregar Productos</h4>
                <label>Producto</label>
                <input type="text" id="producto"/>
                <label>Cantidad</label>
                <input type="number" id="cantidad"/>
                <label>Precio</label>
                <input type="number" id="precio"/>
                <button type="button" id="btnAgregarProducto">Agregar</button>
            </div>
            
            <div>
                <h5>Lista de productos</h5>
                <table class="table table-bordered bg-white">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Precio</th>
                            <th>Subtotal</th>
                        </tr>
                    </thead>
                    <tbody id="detalleFactura"></tbody>
                </table>
            </div>
        </section>

        <!-- Totales protegidos con span para que nadie escriba y se actualicen solos -->
        <section class="bg-light p-3 mt-3 d-flex flex-column align-items-end">
            <h5>Totales</h5>
            <div>
                <label>Subtotal:</label>
                <span id="lblSubtotal" class="fw-bold">0</span>
            </div>
            <div class="mt-2">
                <label>IVA (15%):</label>
                <span id="lblIva" class="fw-bold">0</span>
            </div>
            <div class="mt-2">
                <label>Total a Pagar:</label>
                <span id="lblTotalPagar" class="fw-bold">0</span>
            </div>
        </section>
    </div>
</body>
</html>
